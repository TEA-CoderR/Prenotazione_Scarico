# nginx site for servers where ports 80/443 are already taken (e.g. by a VPN or other sites).
# Visitors reach https://DOMAIN through Cloudflare (proxied, orange cloud); Cloudflare
# connects to this server on port 8443 with a Cloudflare Origin certificate.
#
# Install:  sudo cp deploy/nginx-prenota.conf /etc/nginx/conf.d/prenota.conf
#           (replace DOMAIN and the certificate paths)  &&  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8443 ssl;
    server_name DOMAIN;

    ssl_certificate     /etc/ssl/cloudflare/CERT.pem;
    ssl_certificate_key /etc/ssl/cloudflare/CERT.key;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
