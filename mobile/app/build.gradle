plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Version from CI (run number); local builds are 1.0.0 / 1.
def buildNo = (System.getenv("BUILD_NUMBER") ?: "1").toInteger()
def keystore = System.getenv("SCANNER_KEYSTORE")   // path to the release keystore (CI secret), optional

android {
    namespace 'it.casate.scanner'
    compileSdk 34

    defaultConfig {
        applicationId 'it.casate.scanner'
        minSdk 26
        targetSdk 34
        versionCode buildNo
        versionName "1.0.${buildNo}"
    }

    signingConfigs {
        release {
            if (keystore && file(keystore).exists()) {
                storeFile file(keystore)
                storePassword System.getenv("SCANNER_KEYSTORE_PASSWORD")
                keyAlias 'casate-scanner'
                keyPassword System.getenv("SCANNER_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig (keystore && file(keystore).exists()) ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
