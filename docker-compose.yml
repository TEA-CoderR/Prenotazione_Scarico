# Production stack for the Aruba cloud server.
# Usage: cp .env.example .env  (fill it in)  &&  docker compose up -d --build
#
# Two ways to publish it:
#  - COMPOSE_PROFILES=caddy: the bundled Caddy takes ports 80/443 and gets HTTPS itself.
#  - COMPOSE_PROFILES empty: the server already has a web server (nginx, Cloudflare...);
#    it forwards to the app on 127.0.0.1:${APP_PORT} (see deploy/nginx-prenota.conf).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scarico
      POSTGRES_USER: scarico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Europe/Rome
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scarico -d scarico"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://scarico:${POSTGRES_PASSWORD}@db:5432/scarico
    # Only reachable from the server itself (for an existing nginx in front).
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Nightly dump to ./backups, kept 30 days. Copy that folder off the server as well (see README).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Rome
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U scarico -d scarico -Fc -f /backups/scarico-$$(date +%F).dump \
            && find /backups -name 'scarico-*.dump' -mtime +30 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
