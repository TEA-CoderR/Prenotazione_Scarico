name: Scanner app

# Builds the store scanner app (Zebra TC22) in mobile/. On main the APK is published as the
# GitHub release "scanner-latest" (https://<site>/app redirects to it).
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/scanner.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/scanner.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Release signing key (optional secret)
        env:
          KS: ${{ secrets.SCANNER_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SCANNER_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/scanner.jks"
            echo "SCANNER_KEYSTORE=$RUNNER_TEMP/scanner.jks" >> "$GITHUB_ENV"
            echo "SCANNER_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No SCANNER_KEYSTORE_B64 secret: the APK is signed with a throw-away debug key"
          fi
      - name: Test and build
        run: |
          set -o pipefail
          gradle -p mobile --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|FAILED" -A2 build.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
          cp mobile/app/build/outputs/apk/release/app-release.apk casate-scanner.apk
          # what the app asks to update itself (via <site>/app/version): version, checksum, size
          SHA=$(sha256sum casate-scanner.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s casate-scanner.apk)
          SIGNED=$([ -n "${SCANNER_KEYSTORE:-}" ] && echo true || echo false)
          jq -n --argjson code "$BUILD_NUMBER" --arg sha "$SHA" --argjson size "$SIZE" --argjson signed "$SIGNED" \
            --arg notes "$(git log -1 --pretty=%s | head -c 200)" \
            '{versionCode: $code, versionName: ("1.0." + ($code|tostring)), sha256: $sha, size: $size, notes: $notes, signed: $signed}' > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: casate-scanner
          path: |
            casate-scanner.apk
            version.json
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete scanner-latest --yes --cleanup-tag || true
          gh release create scanner-latest casate-scanner.apk version.json \
            --title "CASA&TE Scanner 1.0.${BUILD_NUMBER}" \
            --notes "App per i terminali Zebra dei negozi. La prima volta installare casate-scanner.apk sul dispositivo; poi l'app si aggiorna da sola." \
            --latest=false
