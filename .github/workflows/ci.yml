name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scarico_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scarico_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:scripts

  docker:
    # Builds the production image exactly as the server will, so a broken Dockerfile shows up here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t prenotazione-scarico:ci .
      - name: Image starts and serves the health check
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=scarico postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 2; done
          docker run -d --name app --network t -e DATABASE_URL=postgres://postgres:pw@db:5432/scarico -p 3000:3000 prenotazione-scarico:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health && break; sleep 2; done
          # The same check deploy/*.sh run inside the container (busybox wget).
          docker exec app wget -qO- http://127.0.0.1:3000/api/health | grep -q '"ok":true' || { docker logs app; exit 1; }
